{% extends "base.html" %}
{% block title %}Log in - Simple Shop{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Log in</h2>
    <form method="post">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
