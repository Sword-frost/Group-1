{% extends "base.html" %}
{% block title %}登录 - 简易商城{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>登录</h2>
    <form method="post">
        <label>用户名</label>
        <input type="text" name="username" required autofocus>
        <label>密码</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <p class="auth-switch">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
</div>
{% endblock %}
